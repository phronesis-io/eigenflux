name: Release Skills

# Publishes the EigenFlux skills bundle to Cloudflare R2 (skills/latest + cli/latest)
# WITHOUT a CLI binary release — the CI equivalent of running
# cli/scripts/release-skills.sh locally. Clients pick up the change on their next
# `skills sync` by comparing the manifest content-hash `revision`.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY  (a scoped R2 API token, Object R/W on the bucket)
#   R2_ENDPOINT, R2_BUCKET, R2_PUBLIC_URL   (non-secret account values; kept as secrets for simplicity)

on:
  push:
    branches: [main]
    paths:
      - 'skills/**'                    # the skills source of truth
      - 'cli/internal/skills/types.go' # ProdAllowlist — which skills get packaged
      - 'cli/.cli.config'              # SKILLS_MIN_CLI_VERSION / SKILLS_REVISION
  workflow_dispatch:                   # manual "Run workflow" button

# contents: write — the sync step commits static/feed_contract.md back.
# pull-requests: write — same step falls back to opening a PR when the direct
# push to main is rejected by branch protection.
permissions:
  contents: write
  pull-requests: write

# One publish at a time — the job overwrites the same skills/latest objects.
concurrency:
  group: release-skills
  cancel-in-progress: false

jobs:
  release-skills:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      # release-skills.sh calls `gtar`; on Ubuntu the default `tar` IS GNU tar.
      - name: Provide gtar
        run: sudo ln -sf "$(command -v tar)" /usr/local/bin/gtar

      - name: Verify toolchain (gtar / aws / shasum / go)
        run: |
          gtar --version | head -1
          aws --version
          shasum -a 256 /dev/null >/dev/null && echo "shasum: ok"
          go version

      - name: Publish skills to R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        run: bash cli/scripts/release-skills.sh

      # static/feed_contract.md is served at runtime by the api gateway but only
      # regenerated by build.sh at deploy time, so the git copy drifts behind
      # canonical between backend deploys. Sync it here — after the publish, so a
      # rejected push can never block a skills release. The commit touches only
      # static/, which is outside this workflow's trigger paths — no loop.
      # A direct push to main only lands if github-actions[bot] can bypass the
      # "changes must be made through a pull request" rule (it cannot under
      # classic branch protection — that needs a ruleset with an Integration
      # bypass actor). When the push is rejected we open a PR instead, so the
      # drift always surfaces as actionable work rather than silently rotting.
      - name: Sync feed contract into static/
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          bash scripts/common/sync-feed-contract.sh
          if git diff --quiet -- static/feed_contract.md; then
            echo "static/feed_contract.md already in sync"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add static/feed_contract.md
          git commit -m "chore(static): sync feed_contract.md from canonical skill source"
          # main may have moved during the publish step; rebase onto it before pushing.
          git fetch origin main
          git rebase origin/main
          if git push origin HEAD:main 2>/tmp/push.err; then
            echo "- synced static/feed_contract.md directly to main (\`$(git rev-parse --short HEAD)\`)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          cat /tmp/push.err
          echo "::warning::direct push to main rejected; falling back to a pull request"
          branch="chore/sync-feed-contract"
          git push -f origin "HEAD:refs/heads/${branch}"
          url=$(gh pr list --head "$branch" --state open --json url --jq '.[0].url')
          if [ -z "$url" ]; then
            url=$(gh pr create --base main --head "$branch" \
              --title "chore(static): sync feed_contract.md from canonical skill source" \
              --body "\`static/feed_contract.md\` drifted behind \`skills/ef-broadcast/references/contract.md\`. Regenerated by \`scripts/common/sync-feed-contract.sh\` in the release-skills workflow. Runtime is unaffected — deploys regenerate this file via \`build.sh\`; this only keeps the git copy honest.")
          fi
          echo "- static/feed_contract.md drift opened as ${url}" >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize published revision
        if: always()
        env:
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        run: |
          if [ -f build/cli/manifest.json ]; then
            rev=$(grep -o '"revision"[^,]*' build/cli/manifest.json | head -1)
            echo "### Skills published" >> "$GITHUB_STEP_SUMMARY"
            echo "- built manifest: \`${rev}\`" >> "$GITHUB_STEP_SUMMARY"
            live=$(curl -fsS "${R2_PUBLIC_URL}/skills/latest/manifest.json" | grep -o '"revision"[^,]*' | head -1 || echo "unavailable")
            echo "- live on R2: \`${live}\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No manifest built — publish step did not reach the build stage." >> "$GITHUB_STEP_SUMMARY"
          fi
