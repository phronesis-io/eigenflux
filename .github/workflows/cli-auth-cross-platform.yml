name: CLI Auth Cross-Platform

on:
  pull_request:
    paths:
      - 'cli/internal/auth/**'
      - 'cli/internal/profilestate/**'
      - 'cli/internal/client/**'
      - 'cli/internal/config/**'
      - 'cli/internal/maintenance/**'
      - 'cli/internal/selfupdate/**'
      - 'cli/internal/skills/**'
      - 'cli/internal/uninstallscript/**'
      - 'cli/internal/desktopnotify/**'
      - 'cli/cmd/**'
      - 'cli/scripts/build.ps1'
      - 'cli/.cli.config'
      - 'skills/**'
      - 'static/install.sh'
      - 'static/uninstall.sh'
      - 'static/uninstall.ps1'
      - 'static/install.ps1'
      - 'cli/scripts/**'
      - '.github/workflows/release-cli.yml'
      - 'tests/cli_release/**'
      - 'tests/installer_release/**'
      - 'scripts/release/publish-installer.py'
      - '.github/workflows/release-installer.yml'
      - 'api/install/shell_installer*.go'
      - 'tests/installhome/**'
      - 'tests/installentry/**'
      - 'cli/tests/**'
      - 'cli/go.mod'
      - 'cli/go.sum'
      - '.github/workflows/cli-auth-cross-platform.yml'
  push:
    branches: [main]
    paths:
      - 'cli/internal/auth/**'
      - 'cli/internal/profilestate/**'
      - 'cli/internal/client/**'
      - 'cli/internal/config/**'
      - 'cli/internal/maintenance/**'
      - 'cli/internal/selfupdate/**'
      - 'cli/internal/skills/**'
      - 'cli/internal/uninstallscript/**'
      - 'cli/internal/desktopnotify/**'
      - 'cli/cmd/**'
      - 'cli/scripts/build.ps1'
      - 'cli/.cli.config'
      - 'skills/**'
      - 'static/install.sh'
      - 'static/uninstall.sh'
      - 'static/uninstall.ps1'
      - 'static/install.ps1'
      - 'cli/scripts/**'
      - '.github/workflows/release-cli.yml'
      - 'tests/cli_release/**'
      - 'tests/installer_release/**'
      - 'scripts/release/publish-installer.py'
      - '.github/workflows/release-installer.yml'
      - 'api/install/shell_installer*.go'
      - 'tests/installhome/**'
      - 'tests/installentry/**'
      - 'cli/tests/**'
      - 'cli/go.mod'
      - 'cli/go.sum'
      - '.github/workflows/cli-auth-cross-platform.yml'
  workflow_dispatch:

# Keep only the newest PR checks; isolate main and manual runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  auth-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - name: Test identity and credential storage
        run: go test ./internal/auth -count=1
      - name: Test signed self-update and native package installation
        run: go test ./internal/selfupdate -count=1
      - name: Test runtime identity persistence and automatic reporting
        run: go test -count=1 ./internal/profilestate ./internal/client ./internal/config ./cmd
      - name: Test uninstall telemetry and owned installation cleanup
        run: |
          go test -count=1 ./internal/maintenance ./internal/watch ./internal/watchservice ./internal/desktopnotify ./internal/uninstallscript
          go test -count=1 -run TestUninstall ./internal/skills
      - name: Test full Skills suite on POSIX
        if: runner.os != 'Windows'
        run: go test -count=1 ./internal/skills
      - name: Test signed Skills installation and upgrade compatibility
        if: runner.os == 'Linux'
        run: go test ./tests
      - name: Test installer and installation entry
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          python3 -m unittest discover -s tests/cli_release -p 'test_*.py'
          python3 -m unittest discover -s tests/installer_release -p 'test_*.py'
          go test ./tests/installhome ./tests/installentry ./api/install
      - name: Test portable signed test packaging
        run: go test ./cmd/devbuild -count=1
      - name: Build Windows signed test bundle
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          ./scripts/build.ps1 -TestBundle -OutDir build/windows-test
          ../build/windows-test/Run-Test.ps1 version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ../build/windows-test/Run-Test.ps1 skills sync
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Windows signed test bundle
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: eigenflux-windows-signed-test
          path: build/windows-test.zip

  windows-download-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - name: Build Windows CLI for download integration tests
        working-directory: cli
        run: |
          New-Item -ItemType Directory -Force ../build | Out-Null
          go build -o ../build/eigenflux.exe .
      - name: Test Windows installer downloads and existing installation registration
        run: python -m unittest discover -s tests/cli_release -p 'test_windows_*.py'

  release-artifact-handoff:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare an executable without release credentials
        run: |
          mkdir -p "$RUNNER_TEMP/release-handoff-source"
          printf '#!/bin/sh\nprintf "handoff-ok\\n"\n' > "$RUNNER_TEMP/release-handoff-source/releasecheck"
          chmod 755 "$RUNNER_TEMP/release-handoff-source/releasecheck"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/release-handoff-source/source-sha.txt"
          tar -C "$RUNNER_TEMP/release-handoff-source" -cf "$RUNNER_TEMP/release-handoff.tar" .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-handoff-${{ github.sha }}
          path: ${{ runner.temp }}/release-handoff.tar
          compression-level: 0
          retention-days: 1
          overwrite: true
          if-no-files-found: error
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-handoff-${{ github.sha }}
          path: ${{ runner.temp }}/release-handoff-download
      - name: Verify the downloaded artifact source and executable permissions
        run: |
          mkdir -p "$RUNNER_TEMP/release-handoff-restored"
          tar -C "$RUNNER_TEMP/release-handoff-restored" -xf "$RUNNER_TEMP/release-handoff-download/release-handoff.tar"
          test "$(cat "$RUNNER_TEMP/release-handoff-restored/source-sha.txt")" = "$GITHUB_SHA"
          test -x "$RUNNER_TEMP/release-handoff-restored/releasecheck"
          test "$("$RUNNER_TEMP/release-handoff-restored/releasecheck")" = handoff-ok
