name: CLI Auth Cross-Platform
on:
  pull_request:
permissions:
  contents: read
jobs:
  windows-targeted-profile:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - name: Measure unchanged heartbeat binding test
        run: python scripts/ci/profile_cmd.py all '^TestHeartbeatUpgradeBindingCompletesOnceAndPreservesJournal$' baseline
      - name: Measure same assertions with unrelated setup isolated
        env:
          EIGENFLUX_SKIP_AGENT_SETUP: '1'
        run: python scripts/ci/profile_cmd.py all '^TestHeartbeatUpgradeBindingCompletesOnceAndPreservesJournal$' isolated
      - name: Profile unchanged uninstall core packages
        run: python scripts/ci/profile_cmd.py uninstall-core '-' uninstall-core
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cli-targeted-profile-Windows
          path: build/ci-profile/
          retention-days: 2
