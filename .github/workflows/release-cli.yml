name: Release CLI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-r2
  cancel-in-progress: false

jobs:
  release-cli:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
      EIGENFLUX_SKILLS_VERIFY_PUBLIC_KEY: ${{ secrets.EIGENFLUX_SKILLS_VERIFY_PUBLIC_KEY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - name: Provide publication tools
        run: |
          brew list gnu-tar >/dev/null 2>&1 || brew install gnu-tar
          brew list awscli >/dev/null 2>&1 || brew install awscli
      - name: Test publication safeguards
        run: |
          aws s3api put-object --generate-cli-skeleton input | python3 -c 'import json,sys; assert "IfNoneMatch" in json.load(sys.stdin)'
          cd cli
          go test ./cmd/clirelease ./tests
      - name: Test CLI artifact publication
        run: |
          python3 -m unittest discover -s tests/cli_release -p 'test_cli_artifacts.py'
          python3 -m unittest discover -s tests/cli_release -p 'test_cli_packages.py'
          python3 -m unittest discover -s tests/cli_release -p 'test_notifier*.py'
          aws s3api put-object --generate-cli-skeleton input | python3 -c 'import json,sys; assert "IfNoneMatch" in json.load(sys.stdin)'
          cd cli
          go test ./internal/selfupdate ./cmd/clirelease ./cmd/notifierrelease
      - name: Resolve notification release inputs
        id: notifier
        env:
          EIGENFLUX_SKILLS_SIGNING_KEY: ${{ secrets.EIGENFLUX_SKILLS_SIGNING_KEY }}
        run: |
          set -euo pipefail
          source cli/.cli.config
          key_file="$RUNNER_TEMP/eigenflux-skills-signing-key"
          umask 077
          printf '%s' "$EIGENFLUX_SKILLS_SIGNING_KEY" > "$key_file"
          echo "EIGENFLUX_SKILLS_SIGNING_KEY_FILE=$key_file" >> "$GITHUB_ENV"
          echo "version=$NOTIFIER_VERSION" >> "$GITHUB_OUTPUT"
          source_hash=$(python3 - <<'PYHASH'
          import hashlib, pathlib
          files = sorted(pathlib.Path('cli/internal/desktopnotify/macos').rglob('*'))
          files += [pathlib.Path('cli/scripts/build-notifier-macos.sh')]
          h = hashlib.sha256()
          for p in files:
              if p.is_file():
                  h.update(str(p).encode() + b'\0' + p.read_bytes() + b'\0')
          print(h.hexdigest())
          PYHASH
          )
          echo "source=$source_hash" >> "$GITHUB_OUTPUT"
      - name: Restore immutable verified notification Apps
        id: notifier-restore
        run: |
          set -euo pipefail
          if python3 cli/scripts/notifier-release.py restore \
              --version '${{ steps.notifier.outputs.version }}' --source '${{ steps.notifier.outputs.source }}' \
              --helpers-dir build/notifier-formal/helpers --work-dir build/notifier-formal/work --team-id "$APPLE_TEAM_ID"; then
            echo 'reused=true' >> "$GITHUB_OUTPUT"
          else
            result=$?
            if [[ "$result" != 3 ]]; then exit "$result"; fi
            echo 'reused=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Configure temporary Apple signing and notarization credentials
        if: steps.notifier-restore.outputs.reused != 'true'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          umask 077
          for name in MACOS_CERTIFICATE_P12_BASE64 MACOS_CERTIFICATE_PASSWORD MACOS_SIGNING_IDENTITY APPLE_ID APPLE_TEAM_ID APPLE_APP_SPECIFIC_PASSWORD; do
            [[ -n "${!name}" ]] || { echo "Missing production release secret: $name" >&2; exit 1; }
          done
          certificate="$RUNNER_TEMP/eigenflux-signing.p12"
          keychain="$RUNNER_TEMP/eigenflux-release.keychain-db"
          keychain_password=$(openssl rand -base64 32)
          echo "::add-mask::$keychain_password"
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | /usr/bin/base64 -D > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          xcrun notarytool store-credentials eigenflux-release --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --keychain "$keychain"
          rm -f "$certificate"
      - name: Resume notification App notarization and publish verified Apps
        if: steps.notifier-restore.outputs.reused != 'true'
        env:
          EIGENFLUX_NOTIFIER_SIGN_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          EIGENFLUX_NOTARY_PROFILE: eigenflux-release
        run: |
          set -euo pipefail
          python3 cli/scripts/notifier-checkpoint.py \
            --version '${{ steps.notifier.outputs.version }}' --source '${{ steps.notifier.outputs.source }}' \
            --helpers-dir build/notifier-formal/helpers --work-dir build/notifier-checkpoint --team-id "$APPLE_TEAM_ID"
          python3 cli/scripts/notifier-release.py publish \
            --version '${{ steps.notifier.outputs.version }}' --source '${{ steps.notifier.outputs.source }}' \
            --helpers-dir build/notifier-formal/helpers --work-dir build/notifier-formal/work --team-id "$APPLE_TEAM_ID"
      - name: Build CLI binaries and signed Skills bundle
        env:
          EIGENFLUX_SKILLS_SIGNING_KEY: ${{ secrets.EIGENFLUX_SKILLS_SIGNING_KEY }}
          EIGENFLUX_SKILLS_VERIFY_PUBLIC_KEY: ${{ secrets.EIGENFLUX_SKILLS_VERIFY_PUBLIC_KEY }}
          EIGENFLUX_NOTIFIER_SIGN_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          EIGENFLUX_NOTARY_PROFILE: eigenflux-release
          EIGENFLUX_NOTIFIER_REUSE: '1'
          EIGENFLUX_NOTIFIER_HELPERS_DIR: ${{ github.workspace }}/build/notifier-formal/helpers
        run: |
          signing_key_file="$RUNNER_TEMP/eigenflux-skills-signing-key"
          printf '%s' "$EIGENFLUX_SKILLS_SIGNING_KEY" > "$signing_key_file"
          chmod 600 "$signing_key_file"
          export EIGENFLUX_SKILLS_SIGNING_KEY_FILE="$signing_key_file"
          bash cli/scripts/build.sh
      - name: Publish CLI binaries
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        run: bash cli/scripts/publish.sh
      - name: Verify published version
        env:
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        run: |
          source cli/.cli.config
          for lane in v2/latest latest; do
            if [[ "$lane" == latest && "$NOTIFIER_VERSION" != "$CLI_VERSION" ]]; then continue; fi
            suffix=""
            if [[ "$lane" == v2/latest ]]; then suffix="-v2"; fi
            live_version=$(curl -fsSL "${R2_PUBLIC_URL}/cli/${lane}/version.txt?run=${GITHUB_RUN_ID}")
            test "$live_version" = "$CLI_VERSION"
            for name in release package-release; do
              curl -fsSL "${R2_PUBLIC_URL}/cli/${lane}/${name}.json?run=${GITHUB_RUN_ID}" -o "$RUNNER_TEMP/cli-${name}.json"
              cmp "build/cli/${name}${suffix}.json" "$RUNNER_TEMP/cli-${name}.json"
            done
          done
      - name: Remove temporary signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/eigenflux-release.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/eigenflux-signing.p12" "$RUNNER_TEMP/eigenflux-skills-signing-key"
