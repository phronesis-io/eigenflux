<!doctype html><html lang="{{.Lang}}"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{.T "钱包" "Wallet"}} · EigenFlux</title>
<style>body{font:1rem/1.6 system-ui,sans-serif;max-width:54rem;margin:auto;padding:1.5rem;color:#222}h2{margin-top:2rem}form{margin:1rem 0}button,input,select{font:inherit;margin:.25rem;padding:.25rem .5rem}label{display:inline-block}output{display:block}table{border-collapse:collapse}td,th{text-align:left;padding:.35rem .65rem;border-bottom:1px solid #ddd}code{overflow-wrap:anywhere}section{overflow-x:auto}</style>
<main id="wallet" data-csrf="{{.CSRF}}"><h1>{{.T "钱包" "Wallet"}}</h1><p id="balance"></p>
<form id="topup"><label>{{.T "支付宝充值金额（分）" "Alipay top-up amount (fen)"}} <input name="amount" max="1000000" type="number" min="1" step="1" required></label><button>{{.T "生成充值链接" "Create top-up link"}}</button> <a id="pay" hidden rel="noreferrer">{{.T "前往支付宝充值" "Top up with Alipay"}}</a></form>
<form id="limit"><label>{{.T "每笔自动支付上限（分）" "Auto-pay limit per payment (fen)"}} <input name="amount" max="9007199254740991" type="number" min="0" step="1" required></label><button>{{.T "保存上限" "Save limit"}}</button></form>
<section><h2>{{.T "储值账单" "Stored-value statement"}}</h2><output id="pending"></output><table><thead><tr><th>{{.T "时间" "Time"}}</th><th>{{.T "类型" "Type"}}</th><th>{{.T "金额" "Amount"}}</th><th>{{.T "订单或调用" "Order or call"}}</th></tr></thead><tbody id="statement"></tbody></table><button id="older" hidden>{{.T "更早的记录" "Older entries"}}</button>
<div id="usage" role="region" aria-label="{{.T "调用明细" "Call details"}}"></div></section>
<section><h2>{{.T "网关密钥" "Gateway keys"}}</h2><ul id="keys"></ul>
<form id="create"><label>{{.T "名称" "Label"}} <input name="label" required maxlength="128"></label>
<label>{{.T "Ed25519 公钥（Base64URL）" "Ed25519 public key (Base64URL)"}} <input name="public_key" required pattern="[A-Za-z0-9_-]{43}"></label>
<label>{{.T "有效天数" "Days valid"}} <input name="days" type="number" min="1" max="365" value="30" required></label><br>
<label>{{.T "每秒请求数" "Requests per second"}} <input name="qps" type="number" min="1" max="1000" value="5" required></label>
<label>{{.T "突发请求数" "Burst requests"}} <input name="burst" type="number" min="1" max="1000" value="10" required></label>
<label>{{.T "每日支出上限（分）" "Daily spending cap (fen)"}} <input name="cap" max="9007199254740991" type="number" min="0"></label>
<label>{{.T "产品 ID（逗号分隔，留空表示全部）" "Product IDs (comma separated, blank for all)"}} <input name="products" pattern="[0-9]+(,[0-9]+)*"></label>
<label>{{.T "允许的 CIDR（逗号分隔）" "Allowed CIDRs (comma separated)"}} <input name="cidrs"></label>
<label><input type="checkbox" name="read">{{.T "允许读取调用明文" "Allow reading call payloads"}}</label> <button>{{.T "注册公钥" "Register public key"}}</button></form></section>
<p id="status" role="status"></p></main>
<script>
const el = id => document.getElementById(id);
const url = '/api/v2/console/bff/';
const money = fen => (fen / 100).toLocaleString(document.documentElement.lang,{style:'currency',currency:'CNY'});
const date = ms => new Date(ms).toLocaleString(document.documentElement.lang);
async function request(path, method='GET', body, key) {
  const opts = {method,headers:{}};
  if (body !== undefined) {
    opts.body = typeof body==='string' ? body : JSON.stringify(body);
    opts.headers={'Content-Type':'application/json','X-CSRF-Token':el('wallet').dataset.csrf,'Idempotency-Key':key};
  }
  const response=await fetch(url+path,opts);
  if (!response.ok) throw new Error(await response.text().then(text=>{try{const e=JSON.parse(text);return e.message || e.msg || response.statusText}catch{return response.statusText}}));
  return (await response.json()).data;
}
function button(label, fn) {
  const b=document.createElement('button');b.textContent=label;
  b.onclick=()=>run(b,fn);return b;
}
async function run(control, fn) {
  control.disabled=true;el('status').textContent='';
  try {await fn()} catch(e){el('status').textContent=e.message || '{{.T "请求失败，请重试。" "Request failed. Try again."}}'} finally{control.disabled=false}
}
async function balance() {
  const data=await request('wallet/balance');
  el('balance').textContent='{{.T "卖方收益" "Seller income"}} '+money(data.income.total_fen)+' · {{.T "可提现" "Withdrawable"}} '+money(data.income.withdrawable_fen)+' · {{.T "储值余额" "Stored value"}} '+money(data.stored_value.balance_fen)+' · {{.T "每笔自动支付上限" "Auto-pay limit"}} '+money(data.stored_value.auto_pay_limit_fen);
  el('limit').elements.amount.value=data.stored_value.auto_pay_limit_fen;
}
async function usage(period,before='0') {
  const data=await request('wallet/usage?period_start='+period+'&before='+before);
  const region=el('usage');if(before==='0'){region.replaceChildren();const h=document.createElement('h3');h.textContent=date(period)+' {{.T "调用明细" "Call details"}}';region.append(h)}
  const list=document.createElement('ul');
  for(const row of data.calls||[]){const li=document.createElement('li');li.textContent=row.call_id+' · '+row.state+' · '+money(row.charged_fen);list.append(li)}
  region.append(list);
  if(data.calls?.length===100){const more=button('{{.T "更多调用" "More calls"}}',async()=>{await usage(period,data.calls.at(-1).call_id);more.remove()});region.append(more)}
}
let cursor=0;
async function statement(append=false) {
  const data=await request('wallet/statement?limit=20&before='+(append?cursor:0));
  if(!append)el('statement').replaceChildren();
  el('pending').textContent='{{.T "待结账" "Pending usage"}} '+money(data.pending.charged_fen);
  for(const row of data.entries||[]){
    const tr=el('statement').insertRow();for(const value of [date(row.created_at),({topup:'{{.T "充值" "Top-up"}}',order_payment:'{{.T "订单付款" "Order payment"}}',order_refund:'{{.T "订单退款" "Order refund"}}',api_usage:'{{.T "API 调用" "API call"}}'})[row.kind],money(row.amount_fen)])tr.insertCell().textContent=value;
    const detail=tr.insertCell();if(row.period_start)detail.append(button('{{.T "查看调用" "View calls"}}',()=>usage(row.period_start)));else detail.textContent=[row.order_id,row.frozen_title].filter(Boolean).join(' ');
    cursor=row.entry_id;
  }
  el('older').hidden=data.entries?.length!==20;
}
async function keys() {
  const data=await request('gateway-keys');const list=el('keys');list.replaceChildren();
  for(const row of data.keys||[]){
    const li=document.createElement('li');li.textContent=row.label+' · '+row.status+' · '+date(row.expires_at)+' ';
    if(row.status!=='revoked')for(const [label,status] of [[row.status==='active'?'{{.T "暂停" "Suspend"}}':'{{.T "恢复" "Resume"}}',row.status==='active'?'suspended':'active'],['{{.T "撤销" "Revoke"}}','revoked']]){
      li.append(button(label,async()=>{if(status==='revoked'&&!window.confirm('{{.T "永久撤销此公钥？" "Permanently revoke this key?"}}'))return;await request('gateway-keys/status','PUT',{fingerprint:row.fingerprint,status},crypto.randomUUID());await keys()}))
    }list.append(li);
  }
}
function submit(id, fn) {
  const form=el(id);let key=crypto.randomUUID(),preparedAt=Date.now();
  form.oninput=()=>{key=crypto.randomUUID();preparedAt=Date.now();if(id==='topup')el('pay').hidden=true};
  form.onsubmit=e=>{e.preventDefault();run(form.querySelector('button'),async()=>{await fn(new FormData(form),key,preparedAt);key=crypto.randomUUID();preparedAt=Date.now()})};
}
submit('limit',async(f,key)=>{await request('wallet/auto-pay-limit','PUT',{auto_pay_limit_fen:Number(f.get('amount'))},key);await balance()});
submit('topup',async(f,key)=>{const data=await request('wallet/topups','POST',{amount_fen:Number(f.get('amount'))},key);if(data.payment_action){const link=new URL(data.payment_action.url);if(link.protocol!=='https:')throw new Error('{{.T "无效的付款链接" "Invalid payment link"}}');el('pay').href=link;el('pay').hidden=false}else{await balance();await statement()}});
submit('create',async(f,key,preparedAt)=>{
  const ids=f.get('products').trim();if(ids&&!/^[1-9][0-9]*(,[1-9][0-9]*)*$/.test(ids))throw new Error('{{.T "产品 ID 无效" "Invalid product ID"}}');
  const policy={label:f.get('label'),public_key:f.get('public_key'),qps:Number(f.get('qps')),burst:Number(f.get('burst')),scopes:f.has('read')?['call','calls:read']:['call'],daily_spend_cap_fen:f.get('cap')===''?null:Number(f.get('cap')),cidr_allowlist:f.get('cidrs').trim()?f.get('cidrs').split(',').map(x=>x.trim()):null,expires_at:preparedAt+Number(f.get('days'))*86400000};
  const body=JSON.stringify(policy).slice(0,-1)+',"product_allowlist":'+(ids?'['+ids+']':'null')+'}';
  await request('gateway-keys','POST',body,key);el('create').reset();await keys();
});
el('older').onclick=()=>run(el('older'),()=>statement(true));
Promise.all([balance(),statement(),keys()]).catch(e=>el('status').textContent=e.message);
</script></html>
