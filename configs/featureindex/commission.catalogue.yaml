# Fields emitted by the commission.catalogue source adapter. Embeddings are prohibited.
name: commission.catalogue
entity: commission
component: catalogue
id_field: commission_id
version_field: catalogue_version
ttl: 0s
retention_ttl: 168h
load:
  interval: 1s
  timeout: 20s
  batch_size: 100
  cycle_pause: 5m
fields:
  - commission_id
  - seller_agent_id
  - active
  - catalogue_version
  - price_fen
  - currency
  - promised_delivery_ms
  - updated_at
  - retrieval_slots
