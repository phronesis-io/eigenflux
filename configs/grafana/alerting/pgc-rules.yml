# PGC 链路告警规则（2026-07-15 首批，来源=7/12 巡检遗留的"外部告警为零"账）。
#
# 措辞规则：annotations.summary 是最终出现在 Lark 卡片上的句子——说人话、
# 无黑话、一句话说清"什么坏了 + 多久了/差多少"。中继端(grafana_relay)只排版
# 不改写。阈值备注了 2026-07-15 的观测基线，改阈值前先看当天真实值。
#
# noDataState 取向：链路可见性规则(停摆/刷新/火警)在 NoData 时也告警——
# 抓不到指标本身就是事故(6/20 日志文档 17 天静默失败的教训)；额度类规则
# NoData 不告警，避免抓取抖动引发狼来了。
apiVersion: 1
groups:
  - orgId: 1
    name: pgc-alerts
    folder: PGC 告警
    interval: 1m
    rules:
      - uid: pgc-pipeline-dead
        title: PGC 管道停摆
        condition: C
        for: 5m
        noDataState: Alerting
        execErrState: Alerting
        annotations:
          summary: 抓取/处理/发布至少一个工序超过 30 分钟没有运行（正常最慢的抓取工序约 4 分钟一轮），或者监控完全抓不到管道指标了。
        labels:
          service: pgc
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: pgc-prometheus
            model:
              expr: max(pgc_worker_last_run_age_seconds)
              instant: true
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { type: gt, params: [1800] }

      - uid: pgc-metrics-stale
        title: PGC 指标刷新停滞
        condition: C
        for: 10m
        noDataState: Alerting
        execErrState: Alerting
        annotations:
          summary: 看板背后的指标已经超过 1 小时没有刷新成功——面板上的数字可能是旧的，别据此判断链路健康。
        labels:
          service: pgc
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: pgc-prometheus
            model:
              expr: time() - min(pgc_metrics_last_refresh_success_timestamp)
              instant: true
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { type: gt, params: [3600] }

      - uid: pgc-source-fire
        title: PGC 信源体检火警
        condition: C
        for: 5m
        noDataState: Alerting
        execErrState: Alerting
        annotations:
          summary: 信源体检发现"火警"级问题——某个重点信源族可能整体熄火了（对照 2026-06 那次静默 50 小时的教训，这条必须当天处理）。
        labels:
          service: pgc
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: pgc-prometheus
            model:
              expr: pgc_source_health_critical_fire
              instant: true
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }

      - uid: pgc-queue-stuck
        title: PGC 判决队列持续积压
        condition: C
        for: 10m
        noDataState: Alerting
        execErrState: Alerting
        annotations:
          summary: 判决队列的积压已经持续 2 小时没有消化回落（上游脉冲正常 1-2 小时内消化完）——处理/判决/发布环节大概率卡住了。worker 心跳正常时也会发生这种事故（对照 7/5 二判全部超时那次），所以"管道停摆"没响不代表没事。
        labels:
          service: pgc
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: pgc-prometheus
            model:
              expr: min_over_time((sum(pgc_queue_fetched + pgc_queue_extracting + pgc_queue_extracted + pgc_queue_processing + pgc_queue_done) or vector(0))[2h:5m])
              instant: true
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { type: gt, params: [500] }

      - uid: pgc-newsapi-budget
        title: NewsAPI 月额度告急
        condition: C
        for: 30m
        noDataState: OK
        execErrState: OK
        annotations:
          summary: NewsAPI 本月额度已用超过 90%——再不管，月底前 NewsAPI 各簇会集体熄火（基线：7/15 月中用量 53%；2026-07-15 起只用单 key，指标仍按 key 导出故用 per-key 序列）。
        labels:
          service: pgc
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: pgc-prometheus
            model:
              expr: pgc_newsapi_key_tokens_pct
              instant: true
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { type: gt, params: [90] }

      - uid: pgc-scraperapi-credits
        title: ScraperAPI 额度告急
        condition: C
        for: 30m
        noDataState: OK
        execErrState: OK
        annotations:
          summary: ScraperAPI 本月 credits 已用超过 90%——Reddit 全量 42 个源和多个代理源都靠它，烧干会一起断（基线：7/15 用量 31%）。
        labels:
          service: pgc
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: pgc-prometheus
            model:
              expr: pgc_scraperapi_credits_pct
              instant: true
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { type: gt, params: [90] }

      # ── 2026-07-28：测量层存活 ─────────────────────────────────────────
      # 补的是一个整类盲区：以前这里只盯"管线活着吗"，没有一条规则盯"衡量
      # 管线的那套东西还活着吗"。实测后果——三个日更审计与小时级判决任务
      # 共用一把锁 /tmp/eigenflux-pgc-judge.lock，日更审计抢不到锁就按
      # `flock --wait 3600` 超时退出（2026-07-28 实测 13:00:00 启动、
      # 14:00:00 退出、状态码 1），报告陈旧 72 小时而面板照常显示旧数字。
      # eigenflux-pgc 侧 rsspipe/metrics.py 的 AUDIT-FRESHNESS CONTRACT 注释
      # 点名依赖下面这条规则；改名或删除请回去同步那段注释。
      - uid: pgc-audit-stale
        title: PGC 审计停摆
        condition: C
        for: 15m
        noDataState: Alerting
        execErrState: Alerting
        annotations:
          summary: 质量审计（内容值得看的比例 / 转述是否忠于原文 / 是否误删真实信息）已经超过 36 小时没有出过新结果——看板上这几个数字是旧的，别据此判断内容质量。常见原因是审计抢不到判决锁被挤掉。
        labels:
          service: pgc
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: pgc-prometheus
            model:
              # 三个日更审计取最旧的一个。周期 24h，阈值 36h＝漏跑一次后
              # 约 12 小时报警，既能抓单次漏跑又不会因为跑得慢而抖动
              # （报告是在跑完时才写的，跑得慢不会推高年龄）。
              expr: max({__name__=~"pgc_broadcast_faithfulness_age_seconds|pgc_broadcast_signal_age_seconds|pgc_discard_audit_age_seconds"})
              instant: true
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { type: gt, params: [129600] }

      - uid: pgc-verdicts-stale
        title: PGC 判决结果停更
        condition: C
        for: 15m
        noDataState: Alerting
        execErrState: Alerting
        annotations:
          summary: 抢先/落后的判决结果已经超过 6 小时没有更新——首屏的"确认抢先条数"和胜负对比都是旧的。
        labels:
          service: pgc
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: pgc-prometheus
            model:
              # 每小时一轮，但 04:00-06:00 UTC 是留给日更审计的维护窗口，
              # 所以正常最大年龄约 220 分钟；6h 阈值留足余量。窗口定义见
              # eigenflux-pgc deploy/pgc-event-verdicts.timer。
              expr: pgc_event_verdicts_age_seconds
              instant: true
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { type: gt, params: [21600] }
